<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escáner de códigos</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#222}
h1{font-size:20px;margin:4px 0 12px}
#wrap{position:relative}
#video{width:100%;max-height:50vh;background:#000;border-radius:10px;object-fit:cover;display:block}
#guia{position:absolute;left:8%;right:8%;top:35%;height:30%;border:2px solid #34a853;border-radius:8px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.25)}
button{font-size:16px;padding:12px;border:0;border-radius:8px;background:#1a73e8;color:#fff;width:100%;margin-top:8px}
button.sec{background:#5f6368}
button:disabled{opacity:.6}
label{display:block;font-weight:600;margin-top:12px;font-size:14px}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px;background:#fff}
#status{margin-top:10px;padding:10px;border-radius:8px;background:#e8f0fe;font-size:14px;min-height:20px}
.ok{background:#e6f4ea!important}
.err{background:#fce8e6!important}
</style>
</head>
<body>
<h1>Escáner de códigos</h1>
<div id="wrap">
<video id="video" autoplay playsinline muted></video>
<div id="guia"></div>
</div>
<button id="startBtn" class="sec" type="button">Activar cámara</button>
<div id="status">Pulsa "Activar cámara", centra el código dentro del recuadro verde y acércalo a unos 10–15 cm. Si no lo lee, escríbelo a mano abajo.</div>

<form id="form">
<label for="codigo">Código</label>
<input id="codigo" type="text" inputmode="numeric" placeholder="Escanéalo o escríbelo aquí">
<label for="formato">Formato</label>
<input id="formato" type="text" placeholder="EAN-13, Code 128 o Manual">
<label for="tipo">Tipo</label>
<select id="tipo">
<option value="Bodega">Bodega</option>
<option value="Medidor">Medidor</option>
</select>
<label id="cantLabel" for="cantidad">Cantidad</label>
<input id="cantidad" type="number" inputmode="decimal" step="any" min="0">
<label for="usuario">Usuario</label>
<input id="usuario" type="text">
<label for="notas">Notas</label>
<textarea id="notas" rows="3"></textarea>
<button type="submit" id="saveBtn">Guardar</button>
</form>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbz1J5pGF_FvmDZU8kdkcAOXjmptCx9NMJvY4-7RCxw1wbr6Q6e3kqtXHiXFHyvsK3RlBg/exec';
const TOKEN = 'AKfycbz1J5pGF_FvmDZU8kdkcAOXjmptCx9NMJvY4-7RCxw1wbr6Q6e3kqtXHiXFHyvsK3RlBg';
const HOJA = 'Escaneos';

const $ = id => document.getElementById(id);
const statusEl = $('status');
const video = $('video');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
let stream = null;
let timer = null;
let busy = false;
let lastCode = '';
let lastTime = 0;

function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ''; }

function updateLabel() { $('cantLabel').textContent = $('tipo').value === 'Medidor' ? 'Lectura' : 'Cantidad'; }
$('tipo').addEventListener('change', updateLabel);
updateLabel();

// Lector nativo del navegador (Chrome en Android). En iPhone no existe: se usa ZXing.
let nativeDetector = null;
if ('BarcodeDetector' in window) {
  try { nativeDetector = new BarcodeDetector({ formats: ['ean_13', 'code_128'] }); } catch (e) { nativeDetector = null; }
}

// Lector ZXing (funciona en Android e iPhone)
let zxing = null;
if (window.ZXing) {
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.CODE_128]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  zxing = new ZXing.MultiFormatReader();
  zxing.setHints(hints);
}

function onCode(text, fmt) {
  const now = Date.now();
  if (text === lastCode && now - lastTime < 2500) return;
  lastCode = text;
  lastTime = now;
  $('codigo').value = text;
  $('formato').value = fmt === 'ean_13' || fmt === 'EAN_13' ? 'EAN-13' : (fmt === 'code_128' || fmt === 'CODE_128' ? 'Code 128' : fmt);
  if (navigator.vibrate) navigator.vibrate(120);
  setStatus('Código leído. Revisa los datos y pulsa Guardar.', 'ok');
}

function decodeZXing() {
  const vw = video.videoWidth, vh = video.videoHeight;
  // Franja central horizontal, donde normalmente está el código
  const cw = Math.round(vw * 0.84), ch = Math.round(vh * 0.36);
  const sx = Math.round((vw - cw) / 2), sy = Math.round((vh - ch) / 2);
  canvas.width = cw;
  canvas.height = ch;
  ctx.drawImage(video, sx, sy, cw, ch, 0, 0, cw, ch);
  try {
    const source = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    const bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));
    const result = zxing.decode(bitmap);
    onCode(result.getText(), ZXing.BarcodeFormat[result.getBarcodeFormat()]);
  } catch (e) {
    // no hay código en esta imagen
  }
}

async function scanFrame() {
  if (busy || !stream || !video.videoWidth) return;
  busy = true;
  try {
    if (nativeDetector) {
      const codes = await nativeDetector.detect(video);
      if (codes.length) {
        onCode(codes[0].rawValue, codes[0].format);
        return;
      }
    }
    if (zxing) decodeZXing();
  } catch (e) {
    // error puntual de lectura: se reintenta en el siguiente cuadro
  } finally {
    busy = false;
  }
}

function stopCamera() {
  clearInterval(timer);
  timer = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  $('startBtn').textContent = 'Activar cámara';
  setStatus('Cámara detenida. Puedes escribir el código a mano.');
}

$('startBtn').addEventListener('click', async () => {
  if (stream) { stopCamera(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('Este navegador no permite la cámara. Escribe el código a mano.', 'err');
    return;
  }
  try {
    setStatus('Abriendo cámara...');
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    // Enfoque continuo, si el teléfono lo permite
    try {
      const track = stream.getVideoTracks()[0];
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    } catch (e) { /* el dispositivo no soporta este ajuste */ }
    $('startBtn').textContent = 'Detener cámara';
    timer = setInterval(scanFrame, 250);
    setStatus('Centra el código en el recuadro verde. Si no lo lee, escríbelo a mano.');
  } catch (err) {
    stream = null;
    setStatus('No se pudo abrir la cámara (' + err.name + '). Escribe el código a mano.', 'err');
  }
});

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const codigo = $('codigo').value.trim();
  const cantidad = $('cantidad').value.trim();
  if (!codigo) { setStatus('Escribe o escanea el código.', 'err'); return; }
  if (cantidad === '') { setStatus('Escribe la cantidad o la lectura.', 'err'); return; }

  const payload = {
    token: TOKEN,
    hoja: HOJA,
    fecha: new Date().toISOString(),
    tipo: $('tipo').value,
    codigo: codigo,
    formato: $('formato').value.trim() || 'Manual',
    cantidad: cantidad,
    usuario: $('usuario').value.trim(),
    notas: $('notas').value.trim()
  };

  $('saveBtn').disabled = true;
  setStatus('Guardando...');
  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      setStatus('Guardado en la hoja.', 'ok');
      $('codigo').value = '';
      $('formato').value = '';
      $('cantidad').value = '';
      $('notas').value = '';
      lastCode = '';
    } else {
      setStatus('Error: ' + data.error, 'err');
    }
  } catch (err) {
    setStatus('No se pudo enviar: ' + err.message, 'err');
  } finally {
    $('saveBtn').disabled = false;
  }
});
</script>
</body>
</html>
